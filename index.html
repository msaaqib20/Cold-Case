function renderBoard(){const ids=Object.keys(state.pins).filter(id=>itemById(id));$('#boardEmpty').hidden=ids.length>0;$('#boardCards').innerHTML=ids.map(id=>{const item=itemById(id),p=state.pins[id],hasArt=['photo','suspect','map'].includes(item.kind);return `<div class="board-card ${connectFrom===id?'selected':''}" role="button" tabindex="0" data-pin="${id}" style="left:${p.x}px;top:${p.y}px;--angle:${p.angle||0}deg" aria-label="${esc(L(item.title))}"><i class="pin-head"></i><button class="pin-remove" data-remove-pin="${id}" aria-label="${esc(t('remove'))}">×</button>${hasArt?'<div class="thumb-art">'+artFor(item)+'</div>':''}<span>${esc(L(item.title))}</span>${hasArt?'':`<div class="board-kind">${t('chapter')} ${item.chapter}<br>№ ${String(CASE.items.indexOf(item)+1).padStart(2,'0')}</div>`}</div>`}).join('');drawStrings();$$('[data-remove-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();removePin(b.dataset.removePin)});$$('[data-pin]').forEach(el=>el.onkeydown=e=>{if(e.target!==el)return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removePin(el.dataset.pin)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(boardMode==='connect'){if(connectFrom)connectPins(connectFrom,el.dataset.pin);else{connectFrom=el.dataset.pin;renderBoard()}}else openInspector(el.dataset.pin)}});updateBoardView();updateHeader()}
function drawStrings(preview=null){const lines=state.strings.map((edge,i)=>{const a=state.pins[edge[0]],b=state.pins[edge[1]];if(!a||!b)return'';const line=`x1="${a.x+75}" y1="${a.y+6}" x2="${b.x+75}" y2="${b.y+6}"`;return `<line class="string-hit" ${line} data-string="${i}"/><line ${line} data-string="${i}"/>`}).join('');let temp='';if(preview&&connectFrom&&state.pins[connectFrom]){const a=state.pins[connectFrom];temp=`<line x1="${a.x+75}" y1="${a.y+6}" x2="${preview.x}" y2="${preview.y}" style="stroke:#d47758;pointer-events:none"/>`}$('#boardStrings').innerHTML=lines+temp;$$('[data-string]').forEach(l=>l.onclick=e=>{e.stopPropagation();state.strings.splice(+l.dataset.string,1);CaseSound.effect('click');save();drawStrings()})}
function boardTransform(){return state.boardView||{x:0,y:0,z:1}}
function updateBoardView(){const v=boardTransform();$('#boardWorld').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`}
function fitBoard(){const vp=$('#boardViewport');if(vp.clientWidth===0)return;const entries=Object.values(state.pins);let x=100,y=80,w=1000,h=650;if(entries.length){x=Math.min(...entries.map(p=>p.x))-60;y=Math.min(...entries.map(p=>p.y))-50;w=Math.max(...entries.map(p=>p.x+150))-x+70;h=Math.max(...entries.map(p=>p.y+175))-y+60}const z=Math.min(1,Math.max(.25,Math.min((vp.clientWidth-20)/w,(vp.clientHeight-20)/h)));state.boardView={z,x:(vp.clientWidth-w*z)/2-x*z,y:(vp.clientHeight-h*z)/2-y*z};updateBoardView();save()}
function zoomBoard(factor,anchor=null){const vp=$('#boardViewport'),v=boardTransform();const a=anchor||{x:vp.clientWidth/2,y:vp.clientHeight/2};const z=Math.max(.22,Math.min(1.8,v.z*factor));state.boardView={x:a.x-(a.x-v.x)*z/v.z,y:a.y-(a.y-v.y)*z/v.z,z};updateBoardView();save()}
function bindBoard(){const vp=$('#boardViewport');const pointers=new Map();let gesture=null,pinch=null;const coords=(x,y)=>{const r=vp.getBoundingClientRect(),v=boardTransform();return{x:(x-r.left-v.x)/v.z,y:(y-r.top-v.y)/v.z}};vp.addEventListener('pointerdown',e=>{if(e.target.closest('.board-zoom,.pin-remove')||e.target.dataset.string!==undefined)return;if(e.button!==0)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);if(pointers.size===2){const a=[...pointers.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),v:{...boardTransform()}};gesture=null;return}const card=e.target.closest('[data-pin]'),id=card?.dataset.pin,p=id?state.pins[id]:null;gesture={x:e.clientX,y:e.clientY,id,p:p?{...p}:null,v:{...boardTransform()},moved:false,connectPrevious:connectFrom};if(id&&boardMode==='connect'){if(!connectFrom)connectFrom=id;card.classList.add('selected')} });vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const a=[...pointers.values()],distance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=vp.getBoundingClientRect();const z=Math.max(.22,Math.min(1.8,pinch.v.z*distance/Math.max(1,pinch.distance))),cx=(a[0].x+a[1].x)/2-r.left,cy=(a[0].y+a[1].y)/2-r.top;state.boardView={z,x:cx-(cx-pinch.v.x)*z/pinch.v.z,y:cy-(cy-pinch.v.y)*z/pinch.v.z};updateBoardView();return}if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>5)gesture.moved=true;if(!gesture.moved)return;if(gesture.id&&boardMode==='connect'){drawStrings(coords(e.clientX,e.clientY));return}if(gesture.id){const p=state.pins[gesture.id];p.x=Math.max(0,Math.min(1250,gesture.p.x+dx/boardTransform().z));p.y=Math.max(0,Math.min(2500,gesture.p.y+dy/boardTransform().z));const card=$(`[data-pin="${gesture.id}"]`);if(card){card.style.left=p.x+'px';card.style.top=p.y+'px'}drawStrings()}else{state.boardView={...gesture.v,x:gesture.v.x+dx,y:gesture.v.y+dy};updateBoardView()}});const end=e=>{pointers.delete(e.pointerId);if(pinch){if(pointers.size===0)pinch=null;gesture=null;save();return}if(!gesture)return;const g=gesture;gesture=null;if(e.type==='pointercancel'){drawStrings();save();return}if(g.id&&boardMode==='connect'){const target=document.elementsFromPoint(e.clientX,e.clientY).map(el=>el.closest?.('[data-pin]')).find(Boolean)?.dataset.pin;if(g.moved&&target&&target!==g.id)connectPins(g.id,target);else if(!g.moved&&g.connectPrevious&&g.connectPrevious!==g.id)connectPins(g.connectPrevious,g.id);else{connectFrom=g.id;renderBoard();toast(t('selectLead'))}}else if(g.id&&!g.moved)openInspector(g.id);save()};vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomBoard(e.deltaY<0?1.12:.89,{x:e.clientX-r.left,y:e.clientY-r.top})},{passive:false})}
function setBoardMode(mode){boardMode=mode;connectFrom=null;$('#boardMove').classList.toggle('active',mode==='move');$('#boardConnect').classList.toggle('active',mode==='connect');$('#boardInstruction').textContent=t(mode==='move'?'moveHelp':'connectHelp');renderBoard()}
function renderIntro(){$('#introText').textContent=L(CASE.meta.intro[introIndex]);$('#introDots').innerHTML=CASE.meta.intro.map((_,i)=>`<i class="${i===introIndex?'active':''}"></i>`).join('');$('#introNext').textContent=t(introIndex===CASE.meta.intro.length-1?'begin':'next')}
async function beginGame(){await CaseSound.start();CaseSound.volume(state.settings.volume);CaseSound.chapter(Math.min(4,state.chapter));if(!state.started){state.name=$('#detectiveName').value.trim().slice(0,40);$('#titleScreen').hidden=true;$('#introScreen').hidden=false;introIndex=0;renderIntro();setTimeout(()=>{if(!$('#introScreen').hidden){$('#introBox').classList.add('opening');CaseSound.effect('paper')}},700)}else{enterDesk();if(state.completed&&state.revealIndex<CASE.final.reveal.length)renderReveal()}}
function enterDesk(first=false){state.started=true;save(true);$('#titleScreen').hidden=true;$('#introScreen').hidden=true;$('#game').hidden=false;gameActive=true;applySettings();renderDesk();renderBoard();renderNotebook();showView('desk');if(first)openModal({kind:'help'})}
function renderReveal(){closeModal();$('#revealScreen').hidden=false;if(state.revealIndex>=CASE.final.reveal.length){renderNewspaper();return}const n=state.revealIndex;$('#revealScreen').innerHTML=`<div class="reveal-copy"><div class="eyebrow">${t('caseClosed')}</div><i class="rule" style="margin:auto"></i><h2>${esc(L(CASE.meta.chapters[Math.min(2,Math.floor(n/2))]))}</h2><p>${esc(L(CASE.final.reveal[n]))}</p><button class="btn primary" id="revealNext">${t('next')}${icon('arrow')}</button><div class="reveal-counter">${String(n+1).padStart(2,'0')} / ${String(CASE.final.reveal.length).padStart(2,'0')}</div></div>`;$('#revealNext').onclick=()=>{state.revealIndex++;save(true);CaseSound.effect('paper');renderReveal()};$('#revealNext').focus({preventScroll:true})}
function formatDuration(seconds){const m=Math.max(1,Math.round(seconds/60));if(state.lang==='ru'){const p=new Intl.PluralRules('ru').select(m);return `${m} ${p==='one'?'минута':p==='few'?'минуты':'минут'}`}return `${m} ${new Intl.PluralRules('en').select(m)==='one'?'minute':'minutes'}`}
function rankIndex(){const hints=state.hints.reduce((a,b)=>a+b,0),score=hints+state.wrong*2;return score<=1?3:score<=6?2:score<=14?1:0}
function renderNewspaper(){closeModal();$('#revealScreen').hidden=false;const date=new Intl.DateTimeFormat(state.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date(state.closedDate||Date.now()));const name=esc(state.name||t('namePlaceholder'));const text=L(CASE.final.epilogue).replaceAll('{name}',name);$('#revealScreen').innerHTML=`<article class="newspaper"><div class="news-masthead">${t('newspaper')}</div><div class="news-date"><span>${esc(date)}</span><span>№ ${CASE.meta.number}</span></div><h1>${t('headline')}</h1><div class="news-byline">${t('byline')} · ${name}</div><div class="news-copy">${text.includes('<p>')?text:'<p>'+text+'</p>'}</div></article><span class="eyebrow">${t('stats')}</span><div class="stats-grid"><div class="stat"><strong>${esc(formatDuration(state.elapsed))}</strong><span>${t('time')}</span></div><div class="stat"><strong>${state.hints.reduce((a,b)=>a+b,0)}</strong><span>${t('hintsUsed')}</span></div><div class="stat"><strong>${state.wrong}</strong><span>${t('wrong')}</span></div></div><div class="rank-box"><small>${t('rank')}</small><h2>${L(UI.ranks[rankIndex()])}</h2></div><div class="final-actions"><button class="btn primary" id="returnDesk">${t('revisit')}</button><button class="btn" id="endSettings">${icon('settings')}${t('settings')}</button></div>`;$('#returnDesk').onclick=()=>{$('#revealScreen').hidden=true;updateHeader();showView('desk')};$('#endSettings').onclick=()=>openModal({kind:'settings'})}
function initAtmosphere(){const grain=$('#grain');grain.innerHTML=CaseArt.texture(83);const grainSvg=$('svg',grain);if(grainSvg){grainSvg.style.width='100%';grainSvg.style.height='100%';grainSvg.setAttribute('preserveAspectRatio','none')}const canvas=$('#atmosphere'),ctx=canvas.getContext('2d');if(!ctx)return;let w=0,h=0,dpr=1;const resize=()=>{dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};resize();window.addEventListener('resize',resize);let seed=54;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const dust=Array.from({length:32},()=>({x:rand(),y:rand(),v:rand()*.4+.15,r:rand()*1.3+.3}));const rain=Array.from({length:38},()=>({x:rand(),y:rand(),v:rand()*.004+.002,len:rand()*25+12}));let last=0;function frame(now){requestAnimationFrame(frame);if(document.hidden||state.settings.motion||now-last<45)return;last=now;ctx.clearRect(0,0,w,h);const title=!$('#titleScreen').hidden||!$('#introScreen').hidden;if(title){ctx.save();ctx.beginPath();ctx.rect(w*.72,0,w*.28,h*.62);ctx.clip();ctx.fillStyle='#899b8b03';ctx.fillRect(w*.72,0,w*.28,h*.62);ctx.strokeStyle='#d1d2a525';ctx.lineWidth=.65;rain.forEach(p=>{p.y=(p.y+p.v)%1;const x=w*(.72+p.x*.28),y=p.y*h*.65;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+p.len);ctx.stroke()});ctx.strokeStyle='#090f0b70';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(w*.86,0);ctx.lineTo(w*.86,h*.65);ctx.moveTo(w*.72,h*.32);ctx.lineTo(w,h*.32);ctx.stroke();ctx.restore()}dust.forEach(p=>{p.y=(p.y-p.v*.00022+1)%1;p.x=(p.x+Math.sin(now*.0001+p.y*10)*.000035+1)%1;const alpha=(1-Math.abs(p.x-.65))*.24;ctx.fillStyle=`rgba(228,208,153,${alpha})`;ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx.fill()})}requestAnimationFrame(frame)}
function initEvents(){document.addEventListener('click',e=>{const lang=e.target.closest('[data-language]');if(lang){changeLanguage(lang.dataset.language);return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='settings')openModal({kind:'settings'});if(action==='help')openModal({kind:'help'});if(action==='evidence')openModal({kind:'evidence',pin:false});if(action==='deduce')openDeduction();if(action==='hint')openHint();const view=e.target.closest('[data-view]')?.dataset.view;if(view)showView(view)});$('#startButton').onclick=beginGame;$('#introNext').onclick=()=>{if(introIndex<CASE.meta.intro.length-1){introIndex++;renderIntro();CaseSound.effect('paper')}else enterDesk(true)};$('#introSkip').onclick=()=>enterDesk(true);$('#playerNotes').oninput=e=>{state.notes=e.target.value;save()};$('#brandButton').onclick=()=>openModal({kind:'help'});$('#coffeeEgg').onclick=()=>egg(0);$('#clockEgg').onclick=()=>egg(2);$('#matchboxEgg').onclick=()=>egg(1);$('#addPin').onclick=()=>openModal({kind:'evidence',pin:true});$('#boardMove').onclick=()=>setBoardMode('move');$('#boardConnect').onclick=()=>setBoardMode('connect');$('#boardMinus').onclick=()=>zoomBoard(.8);$('#boardPlus').onclick=()=>zoomBoard(1.25);$('#boardFit').onclick=fitBoard;bindBoard();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalContext)closeModal();if(e.key==='Tab'&&modalContext){const list=$$('button:not(:disabled),input,textarea,select,[tabindex="0"]',$('#modalRoot')).filter(x=>x.offsetParent!==null);const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});let swipe=null;$('#deskScreen').addEventListener('touchstart',e=>{if(e.target.closest('button,.desk-card'))return;swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#deskScreen').addEventListener('touchend',e=>{if(!swipe)return;const dx=e.changedTouches[0].clientX-swipe.x,dy=e.changedTouches[0].clientY-swipe.y;if(dx< -85&&Math.abs(dy)<60)showView('board');swipe=null},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTape();save(true)}else if(gameActive)CaseSound.resume()});window.addEventListener('pagehide',()=>save(true));let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{applySettings();renderDesk();if(modalContext?.kind==='inspect')setInspectZoom(inspect.zoom);if(screen==='board')fitBoard()},180)});let previous=performance.now();setInterval(()=>{const now=performance.now(),delta=(now-previous)/1000;previous=now;if(gameActive&&!document.hidden&&!state.completed){state.elapsed+=Math.min(delta,2);if(Math.floor(state.elapsed)%15===0)save();if(Date.now()-state.lastProgress>120000){$$('.clue-glint').forEach(x=>x.classList.add('waiting'));const missing=available().find(i=>(i.clues||[]).some(c=>!state.found.includes(c.id)));if(missing)$(`.desk-card[data-id="${missing.id}"]`)?.classList.add('shimmer')}}},1000)}
function init(){applySettings();renderDesk();renderBoard();renderNotebook();initEvents();initAtmosphere();if(!saveAvailable)setTimeout(()=>toast(t('saveError')),1000);try{window.speechSynthesis?.getVoices()}catch{}}
init();
